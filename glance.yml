theme:
  background-color: 0 0 0
  primary-color: 172 69.8 45.5
  contrast-multiplier: 1.2
  disable-picker: true

branding:
  hide-footer: true
  hide-header: true

pages:
  - name: Feeds
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: Sydney, Australia
            units: metric
            hour-format: 12h
            # hide-location: true

      - size: full
        widgets:
          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed
